<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Tailwind Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="calcu.jpg" type="image">
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-800 to-slate-900 h-screen flex items-center justify-center p-4">

    <div class="glass p-6 rounded-3xl shadow-2xl w-full max-w-xs border border-slate-700">
        <div class="mb-6">
            <input type="text" id="display" disabled 
                class="w-full bg-transparent text-right text-4xl text-white font-light tracking-wider outline-none p-2" 
                placeholder="0">
        </div>

        <div class="grid grid-cols-4 gap-3">
            <button onclick="clearDisplay()" class="col-span-2 bg-red-500/20 hover:bg-red-500/40 text-red-400 font-semibold p-4 rounded-2xl transition-all">AC</button>
            <button onclick="deleteLast()" class="bg-slate-700/50 hover:bg-slate-600/50 text-white p-4 rounded-2xl transition-all">DEL</button>
            <button onclick="appendToDisplay('/')" class="bg-blue-500/20 hover:bg-blue-500/40 text-blue-400 font-bold p-4 rounded-2xl transition-all">/</button>

            <button onclick="appendToDisplay('7')" class="bg-slate-700/30 hover:bg-slate-600/30 text-white p-4 rounded-2xl transition-all text-xl">7</button>
            <button onclick="appendToDisplay('8')" class="bg-slate-700/30 hover:bg-slate-600/30 text-white p-4 rounded-2xl transition-all text-xl">8</button>
            <button onclick="appendToDisplay('9')" class="bg-slate-700/30 hover:bg-slate-600/30 text-white p-4 rounded-2xl transition-all text-xl">9</button>
            <button onclick="appendToDisplay('*')" class="bg-blue-500/20 hover:bg-blue-500/40 text-blue-400 font-bold p-4 rounded-2xl transition-all">×</button>

            <button onclick="appendToDisplay('4')" class="bg-slate-700/30 hover:bg-slate-600/30 text-white p-4 rounded-2xl transition-all text-xl">4</button>
            <button onclick="appendToDisplay('5')" class="bg-slate-700/30 hover:bg-slate-600/30 text-white p-4 rounded-2xl transition-all text-xl">5</button>
            <button onclick="appendToDisplay('6')" class="bg-slate-700/30 hover:bg-slate-600/30 text-white p-4 rounded-2xl transition-all text-xl">6</button>
            <button onclick="appendToDisplay('-')" class="bg-blue-500/20 hover:bg-blue-500/40 text-blue-400 font-bold p-4 rounded-2xl transition-all">−</button>

            <button onclick="appendToDisplay('1')" class="bg-slate-700/30 hover:bg-slate-600/30 text-white p-4 rounded-2xl transition-all text-xl">1</button>
            <button onclick="appendToDisplay('2')" class="bg-slate-700/30 hover:bg-slate-600/30 text-white p-4 rounded-2xl transition-all text-xl">2</button>
            <button onclick="appendToDisplay('3')" class="bg-slate-700/30 hover:bg-slate-600/30 text-white p-4 rounded-2xl transition-all text-xl">3</button>
            <button onclick="appendToDisplay('+')" class="bg-blue-500/20 hover:bg-blue-500/40 text-blue-400 font-bold p-4 rounded-2xl transition-all">+</button>

            <button onclick="appendToDisplay('0')" class="col-span-2 bg-slate-700/30 hover:bg-slate-600/30 text-white p-4 rounded-2xl transition-all text-xl">0</button>
            <button onclick="appendToDisplay('.')" class="bg-slate-700/30 hover:bg-slate-600/30 text-white p-4 rounded-2xl transition-all text-xl">.</button>
            <button onclick="calculate()" class="bg-blue-500 hover:bg-blue-600 text-white font-bold p-4 rounded-2xl shadow-lg shadow-blue-500/50 transition-all">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');

        function appendToDisplay(input) {
            display.value += input;
        }

        function clearDisplay() {
            display.value = "";
        }

        function deleteLast() {
            display.value = display.value.slice(0, -1);
        }

        function calculate() {
            try {
                display.value = eval(display.value);
            } catch (error) {
                display.value = "Error";
                setTimeout(clearDisplay, 1500);
            }
        }
    </script>
</body>
</html>
